# CR-001: Endurecer cabeceras HTTP de seguridad en la version candidata (v2)
# Se carga despues de security.conf (prefijo zz-) para que ServerTokens/ServerSignature prevalezcan.
ServerTokens Prod
ServerSignature Off
<IfModule mod_headers.c>
    # ZAP 10021
    Header set X-Content-Type-Options "nosniff"
    # ZAP 10020 (anti-clickjacking)
    Header always set X-Frame-Options "SAMEORIGIN"
    # ZAP 10063
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # ZAP 90004 (COOP / CORP). COEP no se activa: require-corp puede romper recursos incrustados.
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    # ZAP 10037 (fuga de version PHP)
    Header always unset X-Powered-By
    Header unset X-Powered-By
    # No se define Content-Security-Policy restrictiva: romperia la interfaz de OrangeHRM (scripts/estilos en linea).
</IfModule>

